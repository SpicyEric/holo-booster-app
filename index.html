<!doctype html>
<html lang="de" class="light" style="color-scheme: only light;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="only light" />
    <meta name="supported-color-schemes" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <title>Eloyo | Modernes Kundenbindungssystem</title>
    <meta name="description" content="Das moderne NFC-Stempelsystem für lokale Geschäfte. Digitale Bonuskarten, automatische Kundengewinnung und Echtzeit-Statistiken. DSGVO-konform." />
    <script>
      // Website immer im Light Mode halten (auch bei aggressiven Mobile-Dark-Mode-Overlays)
      const isAppRoute = window.location.pathname.startsWith('/app');

      let isApplyingWebsiteLightMode = false;
      const enforceWebsiteLightMode = () => {
        const root = document.documentElement;
        if (root.getAttribute('data-app-route') === 'true' || isApplyingWebsiteLightMode) return;

        isApplyingWebsiteLightMode = true;
        try {
          if (root.classList.contains('dark')) root.classList.remove('dark');
          if (!root.classList.contains('light')) root.classList.add('light');
          if (root.getAttribute('data-app-route') !== 'false') {
            root.setAttribute('data-app-route', 'false');
          }
          if (root.style.colorScheme !== 'only light') {
            root.style.colorScheme = 'only light';
          }
        } finally {
          isApplyingWebsiteLightMode = false;
        }
      };

      if (!isAppRoute) {
        enforceWebsiteLightMode();

        const observer = new MutationObserver(() => {
          enforceWebsiteLightMode();
        });

        observer.observe(document.documentElement, {
          attributes: true,
          attributeFilter: ['class', 'data-app-route'],
        });

        window.addEventListener('load', enforceWebsiteLightMode, { once: true });
      } else {
        document.documentElement.setAttribute('data-app-route', 'true');
      }
    </script>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
