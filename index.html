<!doctype html>
<html lang="de" class="light" style="color-scheme: light;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <link rel="icon" href="/eloyo-logo.png" type="image/png">
    <title>Eloyo | Modernes Kundenbindungssystem</title>
    <meta name="description" content="Das moderne NFC-Stempelsystem für lokale Geschäfte. Digitale Bonuskarten, automatische Kundengewinnung und Echtzeit-Statistiken. DSGVO-konform." />
    <script>
      // CCM19 nur im Web laden – niemals in der nativen App (Capacitor)
      const isNativeApp = Boolean(
        window.Capacitor &&
        typeof window.Capacitor.isNativePlatform === 'function' &&
        window.Capacitor.isNativePlatform()
      );
      const isAppRoute = window.location.pathname.startsWith('/app');

      const enforceWebsiteLightMode = () => {
        if (window.location.pathname.startsWith('/app')) return;
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('light');
        document.documentElement.style.colorScheme = 'only light';
        document.documentElement.setAttribute('data-app-route', 'false');
      };

      // Website immer im Light Mode halten (auch wenn externe Skripte Klassen ändern)
      if (!isAppRoute) {
        enforceWebsiteLightMode();
        new MutationObserver(enforceWebsiteLightMode).observe(document.documentElement, {
          attributes: true,
          attributeFilter: ['class', 'style', 'data-app-route'],
        });
      } else {
        document.documentElement.setAttribute('data-app-route', 'true');
      }

      if (!isNativeApp && !isAppRoute) {
        const s = document.createElement('script');
        s.src = 'https://cloud.ccm19.de/app.js?apiKey=660ca115503b9572cc20f9b9f880685037ec819b9416cb24&domain=69bbb80b3fbf0a75fd05cc62';
        s.referrerPolicy = 'origin';
        document.head.appendChild(s);
      }
    </script>
    <style>
      /* Hide CCM19 cookie widget completely when logged in */
      body.ccm19-right .ccm-root,
      body.ccm19-right [id*="ccm19"],
      body.ccm19-right [class*="ccm-widget"],
      body.ccm19-right [class*="ccm19"] {
        display: none !important;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <meta name="author" content="Eloyo" />

    <meta property="og:title" content="Eloyo | Modernes Kundenbindungssystem" />
    <meta property="og:description" content="Das moderne NFC-Stempelsystem für lokale Geschäfte. Digitale Bonuskarten, automatische Kundengewinnung und Echtzeit-Statistiken." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Eloyo" />
    <meta name="twitter:image" content="/og-image.jpg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
