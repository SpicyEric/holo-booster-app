<!doctype html>
<html lang="de" class="light" style="color-scheme: light;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" href="/eloyo-logo.png" type="image/png">
    <title>Eloyo | Modernes Kundenbindungssystem</title>
    <meta name="description" content="Das moderne NFC-Stempelsystem für lokale Geschäfte. Digitale Bonuskarten, automatische Kundengewinnung und Echtzeit-Statistiken. DSGVO-konform." />
    <script>
      // CCM19 nur im Web laden – niemals in der nativen App (Capacitor)
      const isNativeApp = Boolean(
        window.Capacitor &&
        typeof window.Capacitor.isNativePlatform === 'function' &&
        window.Capacitor.isNativePlatform()
      );
      const isAppRoute = window.location.pathname.startsWith('/app');

      if (!isNativeApp && !isAppRoute) {
        const s = document.createElement('script');
        s.src = 'https://cloud.ccm19.de/app.js?apiKey=660ca115503b9572cc20f9b9f880685037ec819b9416cb24&domain=69bbb80b3fbf0a75fd05cc62';
        s.referrerPolicy = 'origin';
        document.head.appendChild(s);
      }

      // Move CCM19 widget to right side on logged-in routes
      function ccm19PositionCheck() {
        var p = window.location.pathname;
        var isLoggedIn = p.startsWith('/kunde') || p.startsWith('/admin') || p.startsWith('/partner');
        var widget = document.querySelector('[id*="ccm19"], .ccm-widget, [class*="ccm"]');
        if (!widget) {
          // Also try the common CCM19 root element
          var allFixed = document.querySelectorAll('div[style*="position: fixed"][style*="bottom"]');
          allFixed.forEach(function(el) {
            if (el.innerHTML && el.innerHTML.indexOf('ccm') !== -1) widget = el;
          });
        }
        if (widget) {
          if (isLoggedIn) {
            widget.style.setProperty('left', 'auto', 'important');
            widget.style.setProperty('right', '20px', 'important');
          }
        }
      }
      // Run periodically to catch CCM19 after it loads
      var ccm19Interval = setInterval(ccm19PositionCheck, 1000);
      setTimeout(function() { clearInterval(ccm19Interval); }, 15000);
    </script>
    <style>
      /* Move CCM19 cookie widget to right on logged-in merchant/admin/partner routes */
      body.ccm19-right .ccm-root,
      body.ccm19-right [id*="ccm19"],
      body.ccm19-right [class*="ccm-widget"] {
        left: auto !important;
        right: 20px !important;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <meta name="author" content="Eloyo" />

    <meta property="og:title" content="Eloyo | Modernes Kundenbindungssystem" />
    <meta property="og:description" content="Das moderne NFC-Stempelsystem für lokale Geschäfte. Digitale Bonuskarten, automatische Kundengewinnung und Echtzeit-Statistiken." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Eloyo" />
    <meta name="twitter:image" content="/og-image.jpg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
